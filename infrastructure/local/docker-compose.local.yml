# Phase 0 — local-only stack. Not exposed publicly; binds to 127.0.0.1.
# Usage: docker compose -f docker-compose.local.yml --env-file .env up -d

services:
  grafana:
    image: grafana/grafana:11.5.2
    container_name: observability-hub-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Infinity 4.x needs Grafana >=11.6.11 (react/jsx-runtime). 3.8+ needs >=11.6.0.
      # 3.7.1 is the newest catalog build that still loads on Grafana 11.5.2.
      GF_INSTALL_PLUGINS: "yesoreyeram-infinity-datasource 3.7.1"
      # CloudWatch datasource credentials (provisioned YAML reads these)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      # Cloudflare GraphQL (Infinity datasource). Account Analytics: Read.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.4.2
    container_name: observability-hub-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # No host ports — Grafana reaches Loki on the compose network only.

  cf-log-sync:
    image: amazon/aws-cli:2.24.14
    container_name: observability-hub-cf-log-sync
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "syncing s3://$${CF_LOG_BUCKET} -> /logs every 300s"
        while true; do
          aws s3 sync "s3://$${CF_LOG_BUCKET}" /logs --no-progress || echo "s3 sync failed (will retry)"
          sleep 300
        done
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${CF_LOG_REGION:-eu-central-1}
      CF_LOG_BUCKET: ${CF_LOG_BUCKET}
    volumes:
      - cf-access-logs:/logs

  alloy:
    image: grafana/alloy:v1.7.5
    container_name: observability-hub-alloy
    restart: unless-stopped
    depends_on:
      - loki
      - cf-log-sync
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - cf-access-logs:/logs:ro
      - alloy-data:/var/lib/alloy/data

volumes:
  grafana-data:
  loki-data:
  cf-access-logs:
  alloy-data:
